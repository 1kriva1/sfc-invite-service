apiVersion: v1
kind: Service
metadata:
  name: sfc-invite
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-invite
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Internal ClusterIP service for Invite component in SFC application"
spec:
  selector:
    app.kubernetes.io/name: sfc-invite
  type: ClusterIP
  ports:
    - name: sfc-invite-cluster-service-http-port
      protocol: TCP
      port: 7665
      targetPort: 7665
    - name: sfc-invite-cluster-service-https-port
      protocol: TCP
      port: 7666
      targetPort: 7666
  internalTrafficPolicy: Cluster