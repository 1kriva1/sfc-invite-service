syntax = "proto3";

package sfc_invite;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "SFC.Invite.Contracts.Models.Invite.Game.Team";

message GameTeamInvite
{
    int64 id = 1;
    string user_id = 2;
    int64 game_id = 3;
    int64 team_id = 4;
    int32 status_id = 5;
    string game_comment = 6;
    google.protobuf.StringValue team_comment = 7;
}